<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Opportunity Tracker</title>
<meta name="description" content="Summer programs, competitions and big-tech programs open to students in Vietnam, updated every 6 hours.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Opportunities">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  // Apply a saved theme before the page paints, so it never flashes the wrong colours.
  try { var t = JSON.parse(localStorage.getItem("ot:theme")); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="offline" id="offline" role="status" hidden>You're offline. Showing the data saved from your last visit.</div>
<header class="wrap">
  <div class="masthead">
    <a href="#overview" class="h brand">The Opportunity Tracker</a>
    <div class="mast-right">
      <span class="k muted" id="issue">Loading…</span>
      <form class="search" role="search" id="search-form">
        <label class="sr" for="q">Search programs</label>
        <input id="q" type="search" placeholder="Search programs, countries…" autocomplete="off" enterkeyhint="search">
      </form>
      <button class="go small icon" id="theme-toggle" type="button" aria-label="Theme: follows your device" title="Theme"></button>
      <button class="go small" id="install" type="button" hidden>Install app</button>
      <button class="go small" id="elig-toggle" aria-pressed="true">Eligible for me · VN</button>
    </div>
  </div>
  <nav class="nav" aria-label="Sections">
    <a href="#overview"><span class="long">Overview</span><span class="short">Home</span></a>
    <a href="#summer"><span class="long">Summer &amp; study</span><span class="short">Summer</span></a>
    <a href="#compete">Compete</a>
    <a href="#bigtech"><span class="long">Tech &amp; quant</span><span class="short">Tech</span></a>
    <a href="#review">Review<span class="count"></span></a>
    <a href="#tracker"><span class="long">Tracker</span><span class="short">Mine</span></a>
  </nav>
</header>
<main class="wrap" id="view" tabindex="-1"></main>
<footer class="wrap" id="footer"></footer>
<script src="app.js"></script>
</body>
</html>
