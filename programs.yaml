# Curated registry of programs, competitions and internships.
#
# Every entry is watched: its official page is fetched each run, and the status is read
# from phrases such as "applications are open" / "applications closed".
#
# HOW TO VERIFY AN ENTRY
#   1. Open the url and read the eligibility rules.
#   2. Set nationality_ok / enrollment_req / class_years to what the page says.
#   3. Set verified: true. Only verified entries are labelled "Eligible"; the rest say "Likely".
#   4. When the page shows this year's date, set deadline: YYYY-MM-DD (23:59 Vietnam time).
#
# FIELD VALUES
#   kind:            underclassmen | internship | summer_research | summer_school |
#                    hackathon | challenge | business_comp
#   org_type:        big_tech | government_space | university | nonprofit | local_company | other
#   region:          asia | europe | north_america | middle_east | global
#   format:          online | in_person | hybrid
#   nationality_ok:  global | vn_ok | us_only | eu_only | other_restriction | unknown
#   enrollment_req:  any | vn_university_ok | us_canada_only | host_university_only
#   funding:         fully_funded | stipend | travel_covered | free | fee_required
#   window:          months the application window usually covers (estimate until verified)
#   watch_open / watch_closed: extra regexes for this page's own wording (optional)
#   manual_check:    true for sites that block bots; status comes from `window` only
#   tls_fallback:    true for sites with a broken certificate chain (page is re-read without verification)

programs:

